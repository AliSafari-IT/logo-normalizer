name: logo-normalizer

services:
  logo-normalizer:
    image: ${IMAGE_REPOSITORY:-ghcr.io/alisafari-it/logo-normalizer}:${IMAGE_TAG:-local}
    build: .
    container_name: logo-normalizer
    restart: unless-stopped
    networks:
      - asafarim_net

networks:
  asafarim_net:
    external: true
    name: asafarim-com_asafarim_net
